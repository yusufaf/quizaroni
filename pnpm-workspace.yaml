packages:
  - 'apps/*'
  - 'packages/*'
auditConfig:
  # No in-range fix, and none of these reach a production dependency
  # (`pnpm why --prod` is empty); they only run in build and test tooling.
  # The matching Dependabot alerts are dismissed as tolerable risk. Drop an
  # entry once its parent (jest, workbox-build) moves to a fixed major.
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4 # deepmerge: no patched release exists
    - GHSA-3g3m-2fjr-6pw4 # glob: fix is 14.x, jest 30 and workbox pin 10/11
    - GHSA-g3hv-75wg-m249 # minimatch: fix is 11.x, parents pin 3/5/9/10
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
# Hold new releases for 3 days before pnpm will resolve them, including
# transitive ones. Non-strict (pnpm's default), so when an override floor
# demands a version younger than this, pnpm still installs it.
minimumReleaseAge: 4320
overrides:
  '@esbuild-kit/core-utils>esbuild': ^0.25.4
  brace-expansion: ^5.0.12
  dompurify: ^3.4.17
  fast-uri: ^3.1.9
  glob@>=9.0.0 <=14.0.1: '>=14.0.2'
  js-yaml: ^4.3.2
  minimatch@>=7.0.0 <11.0.1: '>=11.0.1'
  nanoid: ^3.3.17
  postcss: ^8.5.18
  undici: ^7.30.1
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
