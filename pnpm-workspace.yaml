packages:
    - 'apps/*'
    - 'packages/*'
overrides:
    dompurify: ^3.4.17
    js-yaml: ^4.3.2
    nanoid: ^3.3.17
    brace-expansion: ^5.0.12
    fast-uri: ^3.1.9
    undici: ^7.30.1
    postcss: ^8.5.18
    '@esbuild-kit/core-utils>esbuild': ^0.25.4
    vite@*: 'catalog:'
catalog:
    vite: npm:@voidzero-dev/vite-plus-core@0.3.3
    vite-plus: 0.3.3
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'
