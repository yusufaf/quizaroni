# Lighthouse against the live site, after each release reaches the host and
# weekly. hosted-image.yml builds a release's image; the host is upgraded by
# hand, so a release run waits until /version.json reports the tag's commit.
# It audits a URL rather than a build; if the domain changes, update SITE
# here and the blocked URLs in lighthouserc.json.
name: lighthouse
on:
  release:
    types: [published]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  # Changes to the audit itself get a run against the current live site.
  pull_request:
    paths:
      - '.github/workflows/lighthouse.yml'
      - '.github/lighthouse/**'
      - 'lighthouserc.json'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  SITE: https://quizaroni.yusufaf.dev
jobs:
  # Not `build`: that's ci.yml's job, and the main ruleset requires it.
  lighthouse:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Wait for the deploy of this commit
        env:
          WANT: ${{ github.sha }}
          WAIT: ${{ github.event_name == 'release' }}
        run: |
          deployed() {
            curl -fsS "$SITE/version.json?t=$(date +%s)" 2>/dev/null \
              | jq -r '.sha // empty' 2>/dev/null || true
          }
          if [ "$WAIT" != "true" ]; then
            sha=$(deployed)
            echo "Live site is on ${sha:-an unknown commit}; auditing it as is."
            exit 0
          fi
          # A later release can go live first (the host skipped this one);
          # it still contains this commit, so audit it.
          includes_want() {
            git cat-file -e "$1^{commit}" 2>/dev/null || git fetch -q origin main 2>/dev/null || true
            git merge-base --is-ancestor "$WANT" "$1" 2>/dev/null
          }
          for _ in $(seq 75); do
            sha=$(deployed)
            if [ "$sha" = "$WANT" ]; then
              echo "Deploy of $WANT is live."
              exit 0
            fi
            if [ -n "$sha" ] && includes_want "$sha"; then
              echo "Live site is on $sha, which includes $WANT."
              exit 0
            fi
            sleep 20
          done
          echo "::error::$WANT wasn't live after 25 minutes (site is on ${sha:-unknown}). Upgrade the host per deploy/hosted/compose.yaml, then re-run this job."
          exit 1
      - name: Lighthouse
        id: lh
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          # Medical prefixes & suffixes, a starter set seeded before the move,
          # imported with its id.
          urls: |
            ${{ env.SITE }}/
            ${{ env.SITE }}/explore
            ${{ env.SITE }}/view/124ab08d-6292-591b-a27e-0abeed412841
          configPath: ./lighthouserc.json
          runs: 3
          uploadArtifacts: true
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          # The action's filesystem upload writes one manifest entry per run.
          MANIFEST: ${{ steps.lh.outputs.resultsPath || '.lighthouseci' }}/manifest.json
        run: |
          if ! jq -e 'length > 0' "$MANIFEST" >/dev/null 2>&1; then
            echo "No Lighthouse results (see the step logs above)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r -f .github/lighthouse/summary.jq "$MANIFEST" | tee -a "$GITHUB_STEP_SUMMARY"
