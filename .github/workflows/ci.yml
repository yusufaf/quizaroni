name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here on purpose — action-setup reads the pnpm version from
      # the root package.json "packageManager" field. Specifying both errors with
      # ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint i18n
        run: pnpm lint:i18n
      - name: Test
        run: pnpm test
      - name: Build frontend
        run: pnpm build:web
      - name: Build backend
        run: pnpm build:api
      - name: Synthesize CDK template
        run: pnpm synth:api
        env:
          account: "000000000000"
          region: us-west-2
          appName: quizaroni
          deploymentType: development
  # The hosted instance's compose file and Caddyfile (deploy/hosted). Caddy is
  # validated through compose so its pinned digest lives in one place.
  hosted-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate compose file
        run: docker compose -f deploy/hosted/compose.yaml config -q
      - name: Validate Caddyfile
        run: docker compose -f deploy/hosted/compose.yaml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  # All five binaries, smoke-tested per OS, plus docker compose on amd64 and arm64.
  binaries:
    uses: ./.github/workflows/binaries.yml
