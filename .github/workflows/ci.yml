name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` here on purpose — action-setup reads the pnpm version from
      # the root package.json "packageManager" field. Specifying both errors with
      # ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build frontend
        run: pnpm build:web
      - name: Build frontend (self-host)
        run: pnpm build:web:selfhost
      - name: Build backend
        run: pnpm build:api
      - name: Synthesize CDK template
        run: pnpm synth:api
        env:
          account: "000000000000"
          region: us-west-2
          appName: quizaroni
          deploymentType: development
