name: audit

# Weekly `pnpm audit` against the advisory database. Dependency bots fix a
# vulnerable direct dependency, or a transitive one whose patched release still
# fits its parent's range (a lockfile refresh). What they cannot fix is a
# transitive dependency whose patch lies outside that range. That needs a
# hand-written entry in the pnpm-workspace.yaml `overrides` block, or a
# deliberate acceptance in `auditConfig.ignoreGhsas`. This run fails while such
# an advisory is open and prints the override to write.
#
# It does not run `pnpm audit --fix`. On pnpm 10.34.5 that writes an override
# for every advisory, ignoring `auditConfig.ignoreGhsas` and `--ignore`, and can
# force a major onto a parent that pins an older one (#309). A plain
# `pnpm audit` does honor the ignore list.

on:
  schedule:
    - cron: '0 15 * * 1' # Mondays 08:00 America/Los_Angeles (15:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose — action-setup reads the pnpm version from
      # the root package.json "packageManager" field. Specifying both errors with
      # ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.node-version

      # `pnpm audit` reads only the lockfile, so no install is needed. Its exit
      # code mixes "advisories found" with registry failures, so classify the
      # JSON instead: a report that does not parse, or has no
      # metadata.vulnerabilities, is a tooling failure rather than a clean result.
      - name: Fail on advisories that are not ignored
        run: |
          pnpm audit --json > "$RUNNER_TEMP/audit.json" || true
          node --input-type=commonjs - "$RUNNER_TEMP/audit.json" <<'EOS'
          const fs = require("fs");
          let report;
          try {
            report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          } catch (error) {
            console.error("::error::pnpm audit did not produce a JSON report (registry or network failure?):", error.message);
            process.exit(1);
          }
          // A clean report still carries an empty `advisories` object, so a
          // missing one means pnpm did not finish the audit.
          if (!report.metadata?.vulnerabilities || typeof report.advisories !== "object" || report.advisories === null) {
            console.error("::error::pnpm audit report is missing metadata.vulnerabilities or advisories:", JSON.stringify(report).slice(0, 500));
            process.exit(1);
          }
          // `advisories` excludes auditConfig.ignoreGhsas entries;
          // metadata.vulnerabilities still counts them.
          const advisories = Object.values(report.advisories);
          if (advisories.length === 0) {
            console.log("No advisories outside auditConfig.ignoreGhsas.");
            process.exit(0);
          }
          for (const advisory of advisories) {
            const head = `${advisory.module_name} ${advisory.github_advisory_id} (${advisory.severity}), vulnerable ${advisory.vulnerable_versions}`;
            const action = advisory.patched_versions === "<0.0.0"
              ? "No patched release exists: replace the parent, or accept it in auditConfig.ignoreGhsas."
              : `Bump the parent, or override it in pnpm-workspace.yaml. Starting point (what --fix would write): '${advisory.module_name}@${advisory.vulnerable_versions}': '${advisory.patched_versions}'. Narrow it if that forces a new major onto a parent that pins an older one.`;
            console.log(`::error::${head}. ${action}`);
          }
          process.exit(1);
          EOS
